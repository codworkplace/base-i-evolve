name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check app/ tests/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bsuser
          POSTGRES_PASSWORD: bspassword
          POSTGRES_DB: bsevolve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bsuser -d bsevolve_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      
      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -U bsuser -h localhost -d bsevolve_test; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          exit 1
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://bsuser:bspassword@localhost:5432/bsevolve_test
      
      - name: Run tests
        run: pytest tests/ -v --cov=app
        env:
          DATABASE_URL: postgresql://bsuser:bspassword@localhost:5432/bsevolve_test
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://api.vsegpt.ru/v1
          OPENAI_MODEL: openai/gpt-4o-mini
          ENVIRONMENT: test

  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t base-i-evolve-api .