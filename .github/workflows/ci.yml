name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bsuser
          POSTGRES_PASSWORD: bspassword
          POSTGRES_DB: bsevolve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://bsuser:bspassword@localhost:5432/bsevolve_test

      - name: Run tests
        run: pytest tests/ -v --cov=app
        env:
          DATABASE_URL: postgresql://bsuser:bspassword@localhost:5432/bsevolve_test
          RENDER: false
