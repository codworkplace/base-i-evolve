services:
  postgres:
    image: postgres:16-alpine
    container_name: bs-evolve-postgres
    environment:
      POSTGRES_USER: bsuser
      POSTGRES_PASSWORD: bspassword
      POSTGRES_DB: bsevolve
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    container_name: bs-evolve-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: workkm30@gmail.com
      PGADMIN_DEFAULT_PASSWORD: nimdadmin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
